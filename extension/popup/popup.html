<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocaDub</title>
  <link rel="stylesheet" href="../common/ui/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="pop-head">
    <span class="pmark" aria-hidden="true">TR</span>
    <strong>LocaDub</strong>
    <span class="ver" id="ver"></span>
  </header>

  <main class="pop-body">
    <section class="update" id="update" aria-label="Güncelleme" hidden>
      <div>
        <b id="updateTitle"></b>
        <p id="updateHint">İndirdiğiniz klasörü eskisinin yerine koyup <b>chrome://extensions</b> sayfasında eklentiyi yenileyin. Modeller ve ayarlar korunur.</p>
      </div>
      <div class="row">
        <button type="button" id="updateNow" class="btn btn-sm btn-primary" hidden>Şimdi güncelle</button>
        <button type="button" id="updateDownload" class="btn btn-sm btn-primary">İndir</button>
        <button type="button" id="updateHow" class="btn btn-sm">Nasıl?</button>
        <button type="button" id="updateLater" class="btn btn-sm btn-plain">Sonra</button>
      </div>
    </section>

    <section class="status" id="state" data-kind="info" aria-label="Durum">
      <div class="status-top" role="status">
        <span class="dot" id="stateDot" aria-hidden="true"></span>
        <div>
          <b id="stateTitle">Durum okunuyor…</b>
          <p id="stateDetail"></p>
        </div>
      </div>
      <div class="progress" id="stateBar" aria-hidden="true" hidden><i></i></div>
      <button type="button" id="stateAction" class="btn btn-sm" hidden></button>
      <label class="tab">
        <span>Bu sekmede dublaj<small id="tabHint">Yalnız bu sekmeyi etkiler</small></span>
        <input type="checkbox" class="switch" role="switch" id="enabled">
      </label>
    </section>

    <div class="group">
      <label class="glabel" for="voice">Ses</label>
      <select id="voice" class="select" aria-label="Seslendirme"></select>
    </div>

    <div class="group">
      <div class="slider">
        <label for="ttsVolume">Dublaj</label>
        <output id="ttsVolumeOut" for="ttsVolume"></output>
        <input class="range" type="range" id="ttsVolume" min="0" max="2" step="0.05">
      </div>
      <div class="slider">
        <label for="originalVolume">Orijinal ses, konuşurken</label>
        <output id="originalVolumeOut" for="originalVolume"></output>
        <input class="range" type="range" id="originalVolume" min="0" max="1" step="0.05">
      </div>
    </div>

    <hr>
    <label class="line" title="Orijinal sesten konuşmayı ayırıp müzik ve efektleri korur (GPU gerekir)">
      <span>Ses ayırma<small>Müzik kalır, yalnız konuşma değişir</small></span>
      <input type="checkbox" class="switch" role="switch" id="separation">
    </label>
  </main>

  <footer class="pop-foot">
    <button type="button" id="openOptions" class="more">Ayarlar <svg viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m1.5 1.5 5.5 5.5-5.5 5.5"/></svg></button>
    <span>Her şey bu bilgisayarda işlenir</span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
