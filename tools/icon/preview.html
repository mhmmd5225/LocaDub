<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Simge önizleme</title>
  <style>
    body { margin: 0; padding: 24px; font: 13px system-ui, sans-serif; display: grid; gap: 24px; }
    .row { display: flex; align-items: end; gap: 28px; padding: 20px; border-radius: 12px; }
    .light { background: #f1f3f4; }
    .dark { background: #202124; color: #ddd; }
    figure { margin: 0; text-align: center; }
    .x4 img { width: 64px; height: 64px; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="row light" id="light"></div>
  <div class="row dark" id="dark"></div>
  <script src="draw-icon.js"></script>
  <script>
    window.icons = drawAll();
    for (const id of ['light', 'dark']) {
      for (const [n, url] of Object.entries(icons)) {
        const f = document.createElement('figure');
        f.innerHTML = `<img src="${url}" width="${n}" height="${n}"><figcaption>${n}px</figcaption>`;
        document.getElementById(id).append(f);
      }
      for (const n of [16, 32]) {
        const f = document.createElement('figure');
        f.className = 'x4';
        f.innerHTML = `<img src="${icons[n]}"><figcaption>${n}px ×4</figcaption>`;
        document.getElementById(id).append(f);
      }
    }
  </script>
</body>
</html>
