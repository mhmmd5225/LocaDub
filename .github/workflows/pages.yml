# site/ klasöründeki tanıtım sayfasını ve indirilebilir eklenti ZIP'ini GitHub Pages'e yayınlar.
name: Tanıtım sayfası

on:
  push:
    branches: [main]
    paths: ['site/**', 'extension/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Eklenti ZIP'i ve version.json (Netlify ile aynı betik)
      - name: Eklenti ZIP'ini hazırla
        run: python3 tools/site/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
