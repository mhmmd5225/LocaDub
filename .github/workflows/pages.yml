# site/ klasöründeki tanıtım sayfasını ve indirilebilir eklenti ZIP'ini GitHub Pages'e yayınlar.
name: Tanıtım sayfası

on:
  push:
    branches: [main]
    paths: ['site/**', 'extension/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Eklenti: LocaDub/ klasörü içinde ZIP (çıkarınca seçilecek klasör doğrudan oluşur)
      - name: Eklenti ZIP'ini hazırla
        run: |
          mkdir -p build/LocaDub
          cp -r extension/. build/LocaDub/
          (cd build && zip -qr -9 ../site/LocaDub.zip LocaDub)
          version=$(jq -r .version extension/manifest.json)
          bytes=$(stat -c %s site/LocaDub.zip)
          printf '{"version":"%s","bytes":%s,"commit":"%s"}\n' "$version" "$bytes" "${GITHUB_SHA::7}" > site/version.json
          cat site/version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
